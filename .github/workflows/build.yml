name: Build and Release JOSM Plugin

on:
  push:
    branches: "trunk"
    paths: 'build.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check version change and extract version
        id: version-check
        run: |
          # If triggered manually, skip the git diff check and proceed directly
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered manually via workflow_dispatch. Skipping diff check."
          else
            # 1. Check if HEAD^ exists to prevent errors on the very first repo commit
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              CHANGES=$(git diff HEAD^ HEAD -- build.xml)
            else
              CHANGES="plugin.version"
            fi
            
            if ! echo "$CHANGES" | grep -q "plugin.version"; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "Skipping: 'plugin.version' was not modified in build.xml."
              exit 0
            fi
          fi
          
          # 2. Extract plugin.version safely without any regex parentheses
          VERSION=$(grep 'name="plugin.version"' build.xml | sed 's/.*value="//' | sed 's/".*//')
          
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract plugin.version from build.xml"
            exit 1
          fi
          
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected plugin version: $VERSION"

      - name: Set up Java JDK
        if: steps.version-check.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build JOSM Plugin with Ant
        if: steps.version-check.outputs.changed == 'true'
        run: ant dist

      - name: Create GitHub Release
        if: steps.version-check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version-check.outputs.version }}
          name: v${{ steps.version-check.outputs.version }}
          files: dist/*.jar
          generate_release_notes: true